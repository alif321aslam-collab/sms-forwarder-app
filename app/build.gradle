plugins {
    id 'com.android.application' version '7.4.2'
}

android {
    namespace 'com.example.smsforwarder'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.smsforwarder"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // ওয়েবসাইটের API তে ডাটা পাঠানোর লাইব্রেরি
    implementation 'com.android.volley:volley:1.2.1'
}
